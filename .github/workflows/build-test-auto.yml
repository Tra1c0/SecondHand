name: Test build
# builds only for a single abi and does not produce an APK

# Fork (stage 63): upstream leftover. It runs testRunTestsUnitTest, which is not how this fork runs its
# tests (agent-tests.yml is), and it was red on every pull request (audit of 2026-11-16). Started by
# hand only; docs/BUILD.md says so.
on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew testRunTestsUnitTest

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
