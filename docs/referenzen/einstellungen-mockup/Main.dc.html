<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Start der Einstellungen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0F}
a{color:inherit;text-decoration:none}
.tile:hover{transform:translateY(-2px)}
.chip:hover{filter:brightness(1.15)}
</style>
</helmet>
<div style="width: 390px; min-height: 1180px; box-sizing: border-box; background: #0B0B0F; color: #F2F2F5; font-family: Inter, sans-serif; padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 0">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.5px">Einstellungen</h1>
    <button aria-label="Einstellungen durchsuchen" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #1E1E24; color: #F2F2F5; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    </button>
  </div>

  <div style="border-radius: 28px; background: #18181D; padding: 14px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #2A2A31">
    <div style="border-radius: 20px; height: 150px; background: linear-gradient(120deg, #00C2A8 0%, #3D7BFF 35%, #8B5CF6 60%, #FF4D8D 80%, #FFB547 100%); padding: 12px; box-sizing: border-box; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 5px">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="40"><div style="border-radius: 7px; background: rgba(11,11,15,0.55)"></div></sc-for>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #A3A3AD">Dein Look</span>
        <span style="font-size: 17px; font-weight: 600">Abgerundet · Licht: Höhenlinien</span>
      </div>
      <a href="Aussehen.dc.html" style="padding: 12px 16px; border-radius: 22px; background: #F2F2F5; color: #0B0B0F; font-weight: 600; font-size: 14px; white-space: nowrap">Ändern</a>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; color: #A3A3AD; padding: 0 4px">Schnell umschalten</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
        <button class="chip" onClick="{{q.toggle}}" aria-pressed="{{q.pressed}}" style="{{q.style}}">{{q.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{areas}}" as="a" hint-placeholder-count="7">
      <a class="tile" href="{{a.href}}" style="{{a.style}}">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; opacity: 0.7">{{a.no}}</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; line-height: 1.15">{{a.title}}</span>
        <span style="font-size: 12.5px; line-height: 1.35; font-weight: 500">{{a.sub}}</span>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; gap: 8px; justify-content: center; padding-top: 4px">
    <a href="System.dc.html" style="padding: 10px 14px; border-radius: 18px; background: #1E1E24; font-size: 13px; color: #C9C9D1">Diagnose</a>
    <a href="System.dc.html" style="padding: 10px 14px; border-radius: 18px; background: #1E1E24; font-size: 13px; color: #C9C9D1">Updates · Build 16</a>
    <a href="System.dc.html" style="padding: 10px 14px; border-radius: 18px; background: #1E1E24; font-size: 13px; color: #C9C9D1">Über</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { on: { ink: false, rgb: true, vib: true, draw: false } }; }
  renderVals() {
    const on = this.state.on;
    const mk = (id, label) => ({
      label, pressed: on[id] ? 'true' : 'false',
      toggle: () => this.setState({ on: { ...on, [id]: !on[id] } }),
      style: 'padding: 11px 15px; min-height: 44px; border-radius: 22px; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; border: 1px solid ' + (on[id] ? 'transparent' : '#33333B') + '; background: ' + (on[id] ? '#F2F2F5' : '#18181D') + '; color: ' + (on[id] ? '#0B0B0F' : '#C9C9D1')
    });
    const tile = (no, title, sub, href, g, wide) => ({ no, title, sub, href,
      style: 'grid-column: ' + (wide ? 'span 2' : 'auto') + '; min-height: ' + (wide ? '110px' : '150px') + '; border-radius: 26px; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; color: #0B0B0F; background: ' + g + '; transition: transform .15s' });
    return {
      keys: Array.from({ length: 40 }),
      quick: [mk('ink', 'Inkognito'), mk('rgb', 'RGB-Licht'), mk('vib', 'Vibration'), mk('draw', 'Symbole malen')],
      areas: [
        tile('01', 'Aussehen', 'Designs, RGB-Licht, Größe, Schrift', 'Aussehen.dc.html', 'linear-gradient(135deg,#FF4D8D,#FFB547)', true),
        tile('02', 'Tippen & Korrektur', 'Autokorrektur, Vorschläge, Lernen', 'Tippen.dc.html', 'linear-gradient(135deg,#00C2A8,#7CF0C8)'),
        tile('03', 'Tasten & Sprachen', 'Sprachen, Zahlenzeile, Popups', 'Tasten.dc.html', 'linear-gradient(135deg,#5B8CFF,#A9C7FF)'),
        tile('04', 'Gesten & Gefühl', 'Leertaste, Malen, Vibration, Ton', 'Gesten.dc.html', 'linear-gradient(135deg,#A78BFA,#E9D5FF)'),
        tile('05', 'Leiste & Befehle', 'Symbolleiste, @-Befehle, Zwischenablage', 'Leiste.dc.html', 'linear-gradient(135deg,#FFC94D,#FFE7A3)'),
        tile('06', 'KI & Automationen', 'Anbieter, Skill-Tasten, Workflows, Diktat', 'KI.dc.html', 'linear-gradient(135deg,#22D3EE,#A5B4FC)', true),
        tile('07', 'System & Daten', 'Profile, Sicherung, Updates, Diagnose', 'System.dc.html', 'linear-gradient(135deg,#94A3B8,#E2E8F0)', true)
      ]
    };
  }
}
</script>
</body>
</html>
